<div
  class="dds-radio"
  [class.dds-radio--focused]="state === 'focused'"
  [class.dds-radio--disabled]="isDisabled"
  [class.dds-radio--invalid]="isInvalid"
>
  <div *ngIf="showLabel" class="dds-radio__field-label">
    {{ label }}<span *ngIf="required" class="dds-radio__required" aria-hidden="true">*</span>
  </div>

  <label class="dds-radio__option" [for]="inputId">
    <input
      class="dds-radio__native"
      type="radio"
      [id]="inputId"
      [name]="name"
      [value]="value"
      [checked]="checked"
      [required]="required"
      [disabled]="isDisabled"
      [attr.aria-label]="showOption ? null : ariaLabel"
      [attr.aria-invalid]="isInvalid ? 'true' : null"
      [attr.aria-describedby]="ariaDescribedBy"
      (change)="handleChange()"
    />
    <span class="dds-radio__circle" aria-hidden="true"><span></span></span>
    <span *ngIf="showOption" class="dds-radio__option-text">{{ option }}</span>
  </label>

  <p *ngIf="isInvalid && showErrorMessage" class="dds-radio__error" [id]="errorId">
    {{ errorMessage }}
  </p>
</div>
