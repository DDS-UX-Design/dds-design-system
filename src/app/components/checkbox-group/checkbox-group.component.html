<fieldset
  class="dds-checkbox-group"
  [class.dds-checkbox-group--inline]="direction === 'inline'"
  [class.dds-checkbox-group--stacked]="direction === 'stacked'"
  [class.dds-checkbox-group--invalid]="state === 'invalid'"
  [disabled]="state === 'disabled' || loading"
  [attr.aria-describedby]="describedBy"
  [attr.aria-required]="required"
  [attr.aria-busy]="loading ? 'true' : null"
  [attr.aria-label]="loading ? 'Loading checkbox group' : null"
>
  <div *ngIf="loading && showLabel" class="dds-checkbox-group__skeleton-legend">
    <dds-skeleton width="144px" height="20px"></dds-skeleton>
  </div>

  <div *ngIf="loading" class="dds-checkbox-group__skeleton-options">
    <div *ngFor="let option of options" class="dds-checkbox-group__skeleton-option">
      <dds-skeleton width="20px" height="20px"></dds-skeleton>
      <dds-skeleton width="72px" height="20px"></dds-skeleton>
    </div>
  </div>

  <div *ngIf="loading && showHelperText" class="dds-checkbox-group__skeleton-supporting-text">
    <dds-skeleton width="180px" height="16px"></dds-skeleton>
  </div>

  <legend *ngIf="!loading && showLabel" class="dds-checkbox-group__legend">
    {{ label }}<span *ngIf="required" aria-hidden="true">*</span>
  </legend>

  <div *ngIf="!loading" class="dds-checkbox-group__options">
    <dds-checkbox
      *ngFor="let option of options; let index = index"
      [inputId]="groupId + '-' + index"
      [option]="option.label"
      [value]="optionValue(option)"
      [state]="optionState(option)"
      [showLabel]="false"
      [showErrorMessage]="false"
      [describedBy]="describedBy"
      (valueChange)="toggle(option, $event)"
    ></dds-checkbox>
  </div>

  <p
    *ngIf="!loading && (state === 'invalid' || showHelperText)"
    class="dds-checkbox-group__supporting-text"
    [class.dds-checkbox-group__supporting-text--error]="state === 'invalid'"
    [id]="supportingTextId"
  >
    {{ state === 'invalid' ? errorMessage : helperText }}
  </p>
</fieldset>
