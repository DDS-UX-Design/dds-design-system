<div
  class="dds-select"
  [class.dds-select--small]="size === 'small'"
  [class.dds-select--focused]="state === 'focused'"
  [class.dds-select--disabled]="isDisabled"
  [class.dds-select--error]="isError"
  [class.dds-select--placeholder]="!value"
>
  <label *ngIf="showLabel" class="dds-select__label" [for]="inputId">
    {{ label }}
    <span *ngIf="required" class="dds-select__required" aria-hidden="true">*</span>
  </label>

  <div class="dds-select__field">
    <select
      class="dds-select__control"
      [id]="inputId"
      [value]="value"
      [required]="required"
      [disabled]="isDisabled"
      [attr.aria-label]="showLabel ? null : ariaLabel"
      [attr.aria-invalid]="isError ? 'true' : null"
      [attr.aria-describedby]="describedBy"
      (change)="handleChange($event)"
    >
      <option value="" disabled>{{ placeholder }}</option>
      <option *ngFor="let option of options" [value]="option.value" [disabled]="option.disabled">
        {{ option.label }}
      </option>
    </select>
    <dds-icon
      class="dds-select__icon"
      name="chevron-down"
      [size]="size === 'small' ? 20 : 24"
      aria-hidden="true"
    ></dds-icon>
  </div>

  <p *ngIf="!isError && showHelperText" class="dds-select__supporting-text" [id]="helperId">
    {{ helperText }}
  </p>

  <p *ngIf="isError" class="dds-select__supporting-text dds-select__error" [id]="errorId">
    {{ errorMessage }}
  </p>
</div>
