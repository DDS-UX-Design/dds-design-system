<article
  class="dds-kpi-card"
  [class.dds-kpi-card--loading]="loading"
  [attr.data-trend]="trend"
  [attr.aria-busy]="loading ? 'true' : null"
  [attr.aria-label]="accessibleLabel"
>
  <ng-container *ngIf="loading; else loadedContent">
    <dds-skeleton width="46%" height="16px"></dds-skeleton>
    <dds-skeleton width="68%" height="28px"></dds-skeleton>
    <dds-skeleton width="58%" height="18px"></dds-skeleton>
  </ng-container>

  <ng-template #loadedContent>
    <p class="dds-kpi-card__label">{{ label }}</p>

    <p class="dds-kpi-card__value">
      <span *ngIf="prefix" class="dds-kpi-card__prefix">{{ prefix }}</span>
      <span>{{ value }}</span
      ><span *ngIf="suffix" class="dds-kpi-card__suffix">{{ suffix }}</span>
    </p>

    <div class="dds-kpi-card__trend">
      <dds-icon
        *ngIf="trendIcon as icon"
        class="dds-kpi-card__trend-icon"
        [name]="icon"
        [size]="16"
        aria-hidden="true"
      ></dds-icon>
      <span>{{ trendText }}</span>
    </div>
  </ng-template>
</article>
