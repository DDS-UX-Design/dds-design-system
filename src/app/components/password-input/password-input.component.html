<div
  class="dds-password-input"
  [class.dds-password-input--mobile]="size === 'mobile'"
  [class.dds-password-input--focused]="state === 'focused'"
  [class.dds-password-input--error]="isError"
  [class.dds-password-input--disabled]="disabled"
  [attr.aria-busy]="loading ? 'true' : null"
  [attr.aria-label]="loading ? 'Loading password input' : null"
>
  <ng-container *ngIf="loading">
    <div *ngIf="showLabel" class="dds-password-input__skeleton-label">
      <dds-skeleton width="88px" [height]="size === 'mobile' ? 16 : 20"></dds-skeleton>
    </div>
    <dds-skeleton width="100%" [height]="size === 'mobile' ? 40 : 48"></dds-skeleton>
  </ng-container>

  <label *ngIf="!loading && showLabel" class="dds-password-input__label" [for]="inputId">
    {{ label }}
    <span *ngIf="required" class="dds-password-input__required" aria-hidden="true">*</span>
  </label>

  <div *ngIf="!loading" class="dds-password-input__field">
    <input
      class="dds-password-input__control"
      [id]="inputId"
      [name]="name"
      [type]="visible ? 'text' : 'password'"
      [value]="value"
      [placeholder]="placeholder"
      [required]="required"
      [disabled]="disabled"
      [autocomplete]="autocomplete"
      [attr.aria-label]="showLabel ? null : ariaLabel"
      [attr.aria-invalid]="isError ? 'true' : null"
      [attr.aria-describedby]="isError && showErrorMessage ? errorId : null"
      (input)="handleInput($event)"
    />

    <button
      class="dds-password-input__visibility"
      type="button"
      [disabled]="disabled"
      [attr.aria-label]="visible ? 'Hide password' : 'Show password'"
      [attr.aria-controls]="inputId"
      [attr.aria-pressed]="visible"
      (click)="toggleVisibility()"
    >
      <dds-icon [name]="visible ? 'eye' : 'eye-off'" [size]="iconSize"></dds-icon>
    </button>
  </div>

  <p
    *ngIf="!loading && isError && showErrorMessage"
    class="dds-password-input__error"
    [id]="errorId"
  >
    {{ errorMessage }}
  </p>
</div>
