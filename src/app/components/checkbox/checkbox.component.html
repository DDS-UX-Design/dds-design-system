<div
  class="dds-checkbox"
  [class.dds-checkbox--focused]="state === 'focused'"
  [class.dds-checkbox--disabled]="isDisabled"
  [class.dds-checkbox--invalid]="isInvalid"
  [attr.aria-busy]="loading ? 'true' : null"
  [attr.aria-label]="loading ? 'Loading checkbox' : null"
>
  <ng-container *ngIf="loading">
    <div *ngIf="showLabel" class="dds-checkbox__skeleton-label">
      <dds-skeleton width="88px" height="20px"></dds-skeleton>
    </div>
    <div class="dds-checkbox__skeleton-option">
      <dds-skeleton width="20px" height="20px"></dds-skeleton>
      <dds-skeleton *ngIf="showOption" width="160px" height="20px"></dds-skeleton>
    </div>
  </ng-container>

  <div *ngIf="!loading && showLabel" class="dds-checkbox__field-label">
    {{ label }}
    <span *ngIf="required" class="dds-checkbox__required" aria-hidden="true">*</span>
  </div>

  <label *ngIf="!loading" class="dds-checkbox__option" [for]="inputId">
    <input
      class="dds-checkbox__native"
      type="checkbox"
      [id]="inputId"
      [checked]="isChecked"
      [indeterminate]="isIndeterminate"
      [required]="required"
      [disabled]="isDisabled"
      [attr.aria-label]="showOption ? null : ariaLabel"
      [attr.aria-invalid]="isInvalid ? 'true' : null"
      [attr.aria-describedby]="ariaDescribedBy"
      (change)="handleChange($event)"
    />
    <span class="dds-checkbox__box" aria-hidden="true">
      <dds-icon
        *ngIf="value !== 'unchecked'"
        [name]="isIndeterminate ? 'minus' : 'check'"
        [size]="14"
        [strokeWidth]="3"
      ></dds-icon>
    </span>
    <span *ngIf="showOption" class="dds-checkbox__option-text">{{ option }}</span>
  </label>

  <p *ngIf="!loading && isInvalid && showErrorMessage" class="dds-checkbox__error" [id]="errorId">
    {{ errorMessage }}
  </p>
</div>
