<div
  class="dds-date-input"
  [class.dds-date-input--mobile]="size === 'mobile'"
  [class.dds-date-input--focused]="state === 'focused' || calendarOpen"
  [class.dds-date-input--error]="isError"
  [class.dds-date-input--disabled]="disabled"
  [class.dds-date-input--loading]="loading"
  [class.dds-date-input--range]="selectionMode === 'range'"
  [class.dds-date-input--open]="calendarOpen"
  [attr.aria-busy]="loading ? 'true' : null"
  [attr.aria-label]="loading ? 'Loading date input' : null"
>
  <ng-container *ngIf="loading; else loadedContent">
    <div *ngIf="showLabel" class="dds-date-input__skeleton-label">
      <dds-skeleton width="72px" [height]="size === 'mobile' ? 16 : 20"></dds-skeleton>
    </div>
    <dds-skeleton width="100%" [height]="size === 'mobile' ? 40 : 48"></dds-skeleton>
    <div *ngIf="showHelperText" class="dds-date-input__skeleton-message">
      <dds-skeleton width="52%" height="16px"></dds-skeleton>
    </div>
  </ng-container>

  <ng-template #loadedContent>
    <label *ngIf="showLabel" class="dds-date-input__label" [for]="inputId">
      {{ label }}
      <span *ngIf="required" class="dds-date-input__required" aria-hidden="true">*</span>
    </label>

    <div class="dds-date-input__field">
      <input
        class="dds-date-input__control"
        [id]="inputId"
        [name]="name"
        type="text"
        [attr.inputmode]="selectionMode === 'range' ? 'text' : 'numeric'"
        [value]="displayValue"
        [placeholder]="placeholder"
        [required]="required"
        [disabled]="disabled"
        [autocomplete]="autocomplete"
        [attr.aria-label]="showLabel ? null : ariaLabel"
        [attr.aria-invalid]="isError ? 'true' : null"
        [attr.aria-describedby]="describedBy"
        (input)="handleInput($event)"
        (blur)="onBlur()"
      />
      @if (calendarEnabled) {
        <button
          #calendarTrigger
          type="button"
          class="dds-date-input__calendar-trigger"
          [attr.aria-label]="'Choose ' + (showLabel ? label : ariaLabel || label)"
          aria-haspopup="dialog"
          [attr.aria-expanded]="calendarOpen"
          [attr.aria-controls]="calendarOpen ? inputId + '-calendar' : null"
          [disabled]="disabled"
          (click)="toggleCalendar()"
        >
          <dds-icon class="dds-date-input__icon" name="calendar-days" [size]="iconSize" />
        </button>
      } @else {
        <dds-icon class="dds-date-input__icon" name="calendar-days" [size]="iconSize" />
      }
    </div>

    <p
      *ngIf="isError && showErrorMessage"
      class="dds-date-input__message dds-date-input__message--error"
      [id]="messageId"
    >
      {{ displayErrorMessage }}
    </p>
    <p *ngIf="!isError && showHelperText" class="dds-date-input__message" [id]="messageId">
      {{ helperText }}
    </p>
  </ng-template>
</div>

@if (calendarOpen) {
  <div
    #panel
    class="dds-date-input__calendar-panel"
    [id]="inputId + '-calendar'"
    popover="manual"
    role="dialog"
    [attr.aria-label]="'Choose ' + (showLabel ? label : ariaLabel || label)"
  >
    <dds-calendar
      [value]="value"
      [selectionMode]="selectionMode"
      (draftChange)="draftValue = $event"
      [size]="size"
      [minDate]="minDate"
      [maxDate]="maxDate"
      [disabled]="disabled"
      (valueChange)="selectDate($event)"
    />
  </div>
}
